<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NYSC: THE EVIL FOREST</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Cinematic Loading / Intro Screen */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0f0d, #1a2e1e);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: #fff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            transition: opacity 1s ease;
        }
        #loading-screen h1 {
            font-size: min(7vw, 36px);
            color: #d4af37;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }
        #loading-screen p {
            font-size: min(4vw, 18px);
            color: #a3c1ad;
            margin-bottom: 30px;
        }
        .start-btn {
            background-color: #d4af37;
            color: #111;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        .start-btn:active {
            transform: scale(0.95);
            background-color: #b89728;
        }
        /* HUD / Game UI */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .hud-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 15px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <!-- Cinematic Loading Screen -->
    <div id="loading-screen">
        <h1>NYSC: THE EVIL FOREST</h1>
        <p>A Cinematic Nigerian Supernatural Survival Experience</p>
        <button class="start-btn" onclick="startGame()">ENTER BUS</button>
    </div>

    <!-- HUD Overlay -->
    <div id="hud" style="display: none;">
        <div class="hud-box">TOKENS: <span id="token-count">0</span></div>
        <div class="hud-box">DISTANCE: <span id="distance-count">0</span>m</div>
    </div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Three.js Library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, player;
        let gameStarted = false;
        let tokens = 0;
        let distance = 0;

        function init3D() {
            const container = document.getElementById('canvas-container');

            // Scene setup with warm atmospheric fog (matching the vibrant animated look)
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Bright daytime sky transitioning to moody tones later
            scene.fog = new THREE.FogExp2(0x1e2a24, 0.015);

            // Camera setup supporting responsive aspect ratios
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 8);
            camera.lookAt(0, 1, 0);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lighting (Warm golden hour sunlight + ambient fill)
            const ambientLight = new THREE.AmbientLight(0xfff8e7, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffdf7e, 1.2);
            sunLight.position.set(10, 20, 10);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // Create Stylized Road (Laterite red soil shoulders + asphalt center)
            const roadGeometry = new THREE.PlaneGeometry(10, 1000);
            const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });
            const road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            scene.add(road);

            // Simple Stylized Player Placeholder (NYSC Khaki uniform colors)
            const playerGeometry = new THREE.BoxGeometry(0.8, 1.8, 0.8);
            const playerMaterial = new THREE.MeshStandardMaterial({ color: 0x3b7a57 }); // Khaki green tone
            player = new THREE.Mesh(playerGeometry, playerMaterial);
            player.position.set(0, 0.9, 0);
            player.castShadow = true;
            scene.add(player);

            // Window resize handler for smooth portrait/landscape switching
            window.addEventListener('resize', onWindowResize);
        }

        function startGame() {
            const loader = document.getElementById('loading-screen');
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
                document.getElementById('hud').style.display = 'flex';
                gameStarted = true;
            }, 1000);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            if (gameStarted) {
                // Move road / increase distance for runner simulation
                distance += 1;
                document.getElementById('distance-count').innerText = distance;
                
                // Subtle runner bobbing animation
                player.position.y = 0.9 + Math.sin(Date.now() * 0.01) * 0.1;
            }

            renderer.render(scene, camera);
        }

        // Initialize on load
        init3D();
        animate();
    </script>
</body>
</html>
